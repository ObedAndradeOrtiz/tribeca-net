<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 90%;
      max-width: 1200px;
      height: 90vh;
      background-color: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 30%;
      background-color: #202c33;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #2a3942;
      border-bottom: 1px solid #394c53;
    }

    .sidebar-header h2 {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d1d1d1;
    }

    .add-chat {
      font-size: 1.8rem;
      color: #25d366;
      cursor: pointer;
    }

    .search-bar {
      padding: 10px 20px;
      background-color: #2a3942;
      border-bottom: 1px solid #394c53;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      font-size: 0.9rem;
      background-color: #394c53;
      color: #fff;
      outline: none;
    }

    .chat-list {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .chat-item:hover {
      background-color: #394c53;
    }

    .chat-item img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      margin-right: 15px;
    }

    .chat-item .chat-details {
      flex-grow: 1;
      border-bottom: 1px solid #394c53;
      padding-bottom: 10px;
    }

    .chat-item .chat-details h3 {
      font-size: 1rem;
      font-weight: bold;
      color: #d1d1d1;
    }

    .chat-item .chat-details p {
      font-size: 0.85rem;
      color: #a8a8a8;
    }

    /* Chat Area */
    .chat-area {
      flex-grow: 1;
      background-color: #efeae2;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background-color: #f7f7f7;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
    }

    .chat-header h3 {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .chat-messages {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      background: url('https://i.imgur.com/6lZLKH3.png') center/cover;
    }

    .message {
      margin-bottom: 20px;
      max-width: 70%;
      display: inline-block;
    }

    .message.sent {
      align-self: flex-end;
      text-align: right;
    }

    .message.received .bubble {
      background-color: #fff;
      color: #333;
    }

    .message.sent .bubble {
      background-color: #d9fdd3;
      color: #333;
    }

    .message .bubble {
      padding: 10px 15px;
      border-radius: 8px;
      display: inline-block;
      line-height: 1.4;
      font-size: 0.9rem;
      word-wrap: break-word;
    }

    .chat-input {
      background-color: #f7f7f7;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      border-top: 1px solid #ddd;
    }

    .chat-input textarea {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      resize: none;
      font-size: 1rem;
      outline: none;
      margin-right: 15px;
    }

    .chat-input button {
      padding: 10px 20px;
      background-color: #25d366;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .chat-input button:hover {
      background-color: #1da955;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <span class="add-chat">+</span>
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Search chats...">
      </div>
      <div class="chat-list">
        <div class="chat-item">
          <img src="https://via.placeholder.com/45" alt="User">
          <div class="chat-details">
            <h3>John Doe</h3>
            <p>Last message preview...</p>
          </div>
        </div>
        <div class="chat-item">
          <img src="https://via.placeholder.com/45" alt="User">
          <div class="chat-details">
            <h3>Jane Smith</h3>
            <p>Another message preview...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <h3>John Doe</h3>
      </div>
      <div class="chat-messages">
        <div class="message received">
          <div class="bubble">Hello! How are you?</div>
        </div>
        <div class="message sent">
          <div class="bubble">I'm good, thank you! And you?</div>
        </div>
      </div>
      <div class="chat-input">
        <textarea rows="1" placeholder="Type a message..."></textarea>
        <button>Send</button>
      </div>
    </div>
  </div>
</body>
</html>
